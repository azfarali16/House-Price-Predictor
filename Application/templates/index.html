<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Prediction</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Karachi House Price Prediction</h1>
        <form method="POST" class="mt-4">
            <div class="form-group">
                <label for="baths">Baths</label>
                <input type="number" class="form-control" id="baths" name="baths" placeholder="Enter number of baths" required min="0">
            </div>
            <div class="form-group">
                <label for="bedrooms">Bedrooms</label>
                <input type="number" class="form-control" id="bedrooms" name="bedrooms" placeholder="Enter number of bedrooms" required min="0">
            </div>
            <div class="form-group">
                <label for="area">Area (sqft)</label>
                <input type="number" class="form-control" id="area" name="area" placeholder="Enter area in sqft" required min="0">
            </div>
            <div class="form-group">
                <label for="property_type">Property Type</label>
                <select class="form-control" id="property_type" name="property_type" required>
                    <option value="" disabled selected>Select property type</option>
                    {% for property in property_types %}
                    <option value="{{ property }}">{{ property.replace('property_type_', '').title() }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="purpose">Purpose</label>
                <select class="form-control" id="purpose" name="purpose" required>
                    <option value="" disabled selected>Select purpose</option>
                    <option value="purpose_For Sale">For Sale</option>
                    <option value="purpose_For Rent">For Rent</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location</label>
                <select class="form-control" id="location" name="location" required>
                    <option value="" disabled selected>Select location</option>
                    {% for loc in locations %}
                    <option value="{{ loc }}">{{ loc.replace('location_','').title() }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Predict Price</button>
        </form>

        {% if prediction is not none %}
            <div class="alert alert-info mt-4" role="alert">
                <h4 class="alert-heading">Predicted Price:</h4>
                <p class="lead">PKR {{ prediction | round(2) }} {{"Lakhs" if inlakh}}</p>
            </div>
        {% endif %}
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
